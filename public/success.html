
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" http-equiv="refresh" content="5;url=/">
<title>Console Style Container</title>
<style>

  body {
     background: linear-gradient(
  135deg,
  oklch(0.12 0.05 265.34) 0%,   
  oklch(0.20 0.08 265.34) 50%, 
  oklch(0.28 0.10 265.34) 100%  );
    font-family: 'Courier New', monospace;
    display: flex;
    height: 100vh;
    margin: 0;
    justify-content: center;
    align-items: flex-start;
  }

  .console-container {
    background-color: #2d2d2d;
    border-radius: 10px;
    width: 400px;
    padding: 20px;
    color: #ffffff;
    box-shadow: 0 0 20px rgba(165, 48, 212, 0.267);
    margin-top: 3rem;
    margin-left: 1rem;
    margin-right: 1rem;
    transition: 0.3s all ease;
  }
  .console-container:hover{
    transform: translateY(-1px) scale(1.02); 
  box-shadow: 0 4px 6px #6014be,
            0 0 20px #885bc0;
  }
  .console-header {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }

  .console-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .close { background-color: #8c08ad; }
  .minimize { background-color: #ffffff; }
  .maximize { background-color: #be6bee; }

  .console-container h1 {
    margin: 0 0 10px 0;
    font-size: 1.5em;
  }

  .console-container p {
    margin: 0;
    line-height: 1.4;
    color: #ccc;
  }
</style>
</head>

<body>

<div class="console-container">
  <div class="console-header">
    <div class="console-btn close"></div>
    <div class="console-btn minimize"></div>
    <div class="console-btn maximize"></div>
  </div>

  <h1> Success = True;</h1>
  <p>I've receved your message and will reply ASAP</p>
  <button>Go back to Home</button>
</div>
<script>
    setTimeout(() => {
      window.location.href = "/TrilhaDev/Home";
    }, 10000);
  </script>
</body>

</html>
